<div class="relative w-full min-h-[70vh] lg:min-h-screen overflow-hidden">
  <!-- Background -->
  <img
    src="/fundo_inicio.svg"
    class="absolute inset-0 w-full h-full object-cover opacity-10 blur-sm"
  />

  <!-- Conteudo -->
  <div class="relative w-full min-h-[inherit] grid grid-cols-1 lg:grid-cols-6 px-6 py-16 sm:px-10 lg:px-0">
    <div class="lg:col-span-4 flex justify-center items-center gap-5 sm:gap-10">
      <div class="self-center h-24 sm:h-28 xl:h-32 w-2 flex-none bg-[#d32f2f] rounded-full opacity-[0] animate-[line-reveal_1s_forwards_1250ms]"></div>

      <div class="flex min-w-0 flex-col justify-center gap-3">
        <div class="relative w-fit">
          <span class="text-black font-bold opacity-[0] animate-[text-fade-in_0.01s_linear_forwards_550ms]">Bem-vindo, me chamo</span>
          <span class="absolute inset-0 opacity-0 bg-[#d32f2f] animate-[text-reveal-dual_1.2s_cubic-bezier(0.77,0,0.175,1)_forwards_0ms]"></span>
        </div>

        <ngx-typed-writer
          class="text-black/80 text-4xl sm:text-5xl xl:text-6xl font-bold leading-tight break-words"
          [strings]="['Guilherme Rippel Moraes']"
          [typeSpeed]="100"
          [backSpeed]="80"
          loop="true"
          cursorChar="_"
          [fadeOutDelay]="1800"
        >
        </ngx-typed-writer>

        <div class="relative w-fit">
          <span class="text-[#d32f2f] text-2xl sm:text-3xl xl:text-4xl font-bold opacity-[0] animate-[text-fade-in_0.01s_linear_forwards_650ms]">Desenvolvedor FrontEnd</span>
          <span class="absolute inset-0 opacity-0 bg-[#d32f2f] animate-[text-reveal-dual_1.2s_cubic-bezier(0.77,0,0.175,1)_forwards_150ms]"></span>
        </div>
      </div>
    </div>

    <!-- Tech scroll -->
    <div class="lg:col-span-2 flex w-full justify-center items-center pt-10 lg:pt-0">
      <div class="relative overflow-hidden w-full max-w-sm lg:max-h-80 lg:w-10">
        <div
          class="flex w-max flex-row lg:w-auto lg:flex-col justify-start gap-5 animate-[tech-scroll-x_10s_linear_infinite] lg:animate-[tech-scroll_10s_linear_infinite]
                 hover:[animation-play-state:paused]"
        >
          <fa-icon
            *ngFor="let tech of techStack"
            [icon]="tech.icon"
            class="text-3xl sm:text-4xl text-gray-700 hover:text-[#d32f2f] transition"
            [title]="tech.name"
          ></fa-icon>
        </div>

        <!-- Fade left -->
        <div
          class="lg:hidden absolute top-0 left-0 h-full w-12
                 bg-gradient-to-r from-white to-transparent
                 pointer-events-none"
        ></div>

        <!-- Fade right -->
        <div
          class="lg:hidden absolute top-0 right-0 h-full w-12
                 bg-gradient-to-l from-white to-transparent
                 pointer-events-none"
        ></div>

        <!-- Fade top -->
        <div
          class="hidden lg:block absolute top-0 left-0 w-full h-12
                 bg-gradient-to-b from-white to-transparent
                 pointer-events-none"
        ></div>

        <!-- Fade bottom -->
        <div
          class="hidden lg:block absolute bottom-0 left-0 w-full h-12
                 bg-gradient-to-t from-white to-transparent
                 pointer-events-none"
        ></div>
      </div>
    </div>
  </div>
</div>
