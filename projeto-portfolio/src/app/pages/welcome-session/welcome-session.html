<div class="relative w-full h-screen overflow-hidden">
  <!-- Background -->
  <img
  src="/fundo_inicio.svg"
  class="absolute inset-0 w-full h-full object-cover opacity-10 blur-sm"
/>

  <!-- Conteúdo -->
  <div class="w-full h-full grid grid-cols-6">
    <div class="col-span-4 flex justify-center items-center gap-10">
      <div class="h-2/12 w-2 bg-[#d32f2f] rounded-full opacity-[0] animate-[line-reveal_1s_forwards_1250ms]"></div>

      <div class="flex flex-col justify-center gap-2 h-2/12">
        <div class="relative w-fit">
          <span class="text-black font-bold opacity-[0] animate-[text-fade-in_0.01s_linear_forwards_550ms]">Bem-vindo, me chamo</span>
          <span class="absolute inset-0 opacity-0 bg-[#d32f2f] animate-[text-reveal-dual_1.2s_cubic-bezier(0.77,0,0.175,1)_forwards_0ms]"></span>
        </div>

        <ngx-typed-writer
          class="text-black/80 text-6xl font-bold"
          [strings]="['Guilherme Rippel Moraes']"
          [typeSpeed]="100"
          [backSpeed]="80"
          loop="true"
          cursorChar="_"
          [fadeOutDelay]="1800"
        >
        </ngx-typed-writer>

        <div class="relative w-fit">
          <span class="text-[#d32f2f] text-4xl font-bold opacity-[0] animate-[text-fade-in_0.01s_linear_forwards_650ms]">Desenvolvedor FrontEnd</span>
           <span class="absolute inset-0 opacity-0 bg-[#d32f2f] animate-[text-reveal-dual_1.2s_cubic-bezier(0.77,0,0.175,1)_forwards_150ms]"></span>
        </div>
      </div>
    </div>

    <!-- Tech scroll -->
    <div class="col-span-2 flex w-full h-full justify-center items-center">
      <div class="relative max-h-80 overflow-hidden w-10">
        <div
          class="flex flex-col gap-5 animate-[tech-scroll_10s_linear_infinite]
                 hover:[animation-play-state:paused]"
        >
          <fa-icon
            *ngFor="let tech of techStack"
            [icon]="tech.icon"
            class="text-4xl text-gray-700 hover:text-[#d32f2f] transition"
            [title]="tech.name"
          ></fa-icon>
        </div>

        <!-- Fade top -->
        <div
          class="absolute top-0 left-0 w-full h-12
                 bg-gradient-to-b from-white to-transparent
                 pointer-events-none"
        ></div>

        <!-- Fade bottom -->
        <div
          class="absolute bottom-0 left-0 w-full h-12
                 bg-gradient-to-t from-white to-transparent
                 pointer-events-none"
        ></div>
      </div>
    </div>
  </div>
</div>
