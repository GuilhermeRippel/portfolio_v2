<div class="flex flex-col lg:justify-between h-full items-center gap-6 px-4 py-5 lg:py-10">
  <!-- Perfil -->
  <div class="flex flex-col gap-2 lg:gap-3 w-full justify-center items-center text-black select-none">
    <img
      src="assets/PerfilMenu.png"
      alt="Foto de Guilherme Rippel"
      class="w-20 h-20 lg:w-32 lg:h-32 rounded-full
             object-cover object-center
             border-2 border-neutral-300
             shadow-sm
             bg-white"
    />

    <span class="font-bold text-lg lg:text-xl tracking-wide text-center">
      Guilherme Rippel
    </span>

    <span class="text-sm text-neutral-500 text-center">
      Desenvolvedor FrontEnd
    </span>
  </div>

  <!-- Menu -->
  <div class="w-full text-center tracking-wide">
    <ul class="font-bold text-gray-800 flex flex-wrap lg:flex-col justify-center items-center gap-3 lg:gap-7 w-full">
      <li class="whitespace-nowrap hover:text-[#d32f2f] transition-colors duration-200 cursor-pointer px-3 py-1 text-sm sm:text-base lg:w-3/5 lg:text-lg" routerLink="/">P&aacute;gina Inicial</li>
      <li class="whitespace-nowrap hover:text-[#d32f2f] transition-colors duration-200 cursor-pointer px-3 py-1 text-sm sm:text-base lg:w-3/5 lg:text-lg" routerLink="/about">Sobre mim</li>
      <li class="whitespace-nowrap hover:text-[#d32f2f] transition-colors duration-200 cursor-pointer px-3 py-1 text-sm sm:text-base lg:w-3/5 lg:text-lg" routerLink="/experience">Experi&ecirc;ncias</li>
      <li class="whitespace-nowrap hover:text-[#d32f2f] transition-colors duration-200 cursor-pointer px-3 py-1 text-sm sm:text-base lg:w-3/5 lg:text-lg" routerLink="/projects">Meus Projetos</li>
    </ul>
  </div>

  <!-- Botao -->
  <div class="w-full text-center">
    <button
      (click)="openWhatsapp()"
      class="bg-[#d32f2f] font-bold text-white w-full max-w-56 lg:w-2/3 py-2 rounded-3xl shadow-lg transition-colors duration-300 cursor-pointer"
      type="button"
    >
      Entrar em contato
    </button>
  </div>

  <!-- Icones sociais -->
  <div class="flex gap-6 lg:mt-6">
    <a href="https://gmail.com" target="_blank" class="hover:text-[#d32f2f]">
      <fa-icon [icon]="faEnvelope"></fa-icon>
    </a>

    <a href="https://linkedin.com" target="_blank" class="hover:text-[#d32f2f]">
      <fa-icon [icon]="faLinkedin"></fa-icon>
    </a>

    <a href="https://github.com/GuilhermeRippel" target="_blank" class="hover:text-[#d32f2f]">
      <fa-icon [icon]="faGithub"></fa-icon>
    </a>
  </div>
</div>
